<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: system-ui, sans-serif; padding: 12px; background: #1a1a2e; color: #eee; margin: 0; font-size: 13px; }
    h3 { margin: 0 0 12px 0; font-size: 15px; }
    #task-input { width: 100%; padding: 8px; margin: 8px 0; border-radius: 6px;
                  border: 1px solid #444; background: #16213e; color: #eee;
                  box-sizing: border-box; }
    button { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer;
             background: #0f3460; color: #eee; margin-right: 8px; font-size: 13px; }
    button:hover:not(:disabled) { background: #1a4a7a; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #status { margin: 12px 0; padding: 8px; background: #16213e; border-radius: 6px;
              font-size: 13px; white-space: pre-wrap; min-height: 18px; }
    #plan { margin: 8px 0; font-size: 12px; }
    .step { padding: 6px 10px; margin: 3px 0; background: #0f3460; border-radius: 4px;
            border-left: 3px solid transparent; }
    .step.active { background: #e65100; border-left-color: #ffb74d; }

    .explorer-card {
      margin: 12px 0; padding: 10px 12px; background: #16213e;
      border-radius: 6px; border: 1px solid #0f3460;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .explorer-left { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
    .explorer-title { font-size: 13px; font-weight: 600; color: #eee; }
    .explorer-hint { font-size: 10px; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .explorer-hint.ready { color: #4caf50; }
    .explorer-hint.warn { color: #ff9800; }
    .explorer-hint.search { color: #4fc3f7; }

    .toggle-switch { position: relative; display: inline-block; width: 40px; height: 22px; flex-shrink: 0; }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .toggle-slider { position: absolute; cursor: pointer; inset: 0; background: #444;
                     transition: background 0.2s; border-radius: 22px; }
    .toggle-slider:before { position: absolute; content: ""; height: 16px; width: 16px;
                            left: 3px; bottom: 3px; background: #ccc; transition: transform 0.2s, background 0.2s;
                            border-radius: 50%; }
    .toggle-switch input:checked + .toggle-slider { background: #0e639c; }
    .toggle-switch input:checked + .toggle-slider:before { transform: translateX(18px); background: #fff; }
    .toggle-switch input:disabled + .toggle-slider { opacity: 0.4; cursor: not-allowed; }

    .mode-indicator {
      margin-top: 8px; padding: 6px 10px; background: #16213e; border-radius: 4px;
      font-size: 11px; color: #888; border-left: 3px solid #444;
    }
    .mode-indicator.agent { border-left-color: #4caf50; color: #4caf50; }
    .mode-indicator.coding { border-left-color: #4fc3f7; color: #4fc3f7; }
    .reasoning-panel {
  margin: 12px 0;
  background: #0d1117;
  border: 1px solid #1f6feb;
  border-radius: 6px;
  overflow: hidden;
  max-height: 320px;
  display: flex;
  flex-direction: column;
}

.reasoning-header {
  padding: 8px 12px;
  background: #161b22;
  border-bottom: 1px solid #1f6feb;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.reasoning-title {
  font-size: 11px;
  font-weight: 600;
  color: #58a6ff;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.reasoning-clear {
  background: transparent;
  color: #8b949e;
  border: 1px solid #30363d;
  padding: 2px 8px;
  border-radius: 3px;
  font-size: 10px;
  cursor: pointer;
  margin: 0;
}

.reasoning-clear:hover { background: #21262d; color: #c9d1d9; }

.reasoning-body {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
  font-family: 'Consolas', 'Monaco', monospace;
  font-size: 11px;
  line-height: 1.5;
  color: #c9d1d9;
}

.reasoning-body::-webkit-scrollbar { width: 6px; }
.reasoning-body::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }

.reasoning-empty {
  color: #6e7681;
  text-align: center;
  padding: 20px 0;
  font-style: italic;
}

.reasoning-entry {
  margin-bottom: 4px;
  padding: 4px 6px;
  border-left: 2px solid #30363d;
  background: #161b22;
  border-radius: 3px;
}

.reasoning-entry.info { border-left-color: #58a6ff; }
.reasoning-entry.success { border-left-color: #3fb950; }
.reasoning-entry.error { border-left-color: #f85149; }
.reasoning-entry.think { border-left-color: #d29922; background: #1c1a11; }

.reasoning-entry .timestamp {
  color: #6e7681;
  font-size: 9px;
  margin-right: 6px;
}

.reasoning-entry .label {
  font-weight: 600;
  margin-right: 4px;
}

.reasoning-entry.info .label { color: #58a6ff; }
.reasoning-entry.success .label { color: #3fb950; }
.reasoning-entry.error .label { color: #f85149; }
.reasoning-entry.think .label { color: #d29922; }
  </style>
</head>
<body>
  <h3>Browser Agent</h3>

  <div class="explorer-card">
    <div class="explorer-left">
      <div class="explorer-title">Code Explorer</div>
      <div class="explorer-hint" id="explorerHint">Checking server...</div>
    </div>
    <label class="toggle-switch">
      <input type="checkbox" id="explorerToggle" disabled>
      <span class="toggle-slider"></span>
    </label>
  </div>

  <input id="task-input" placeholder="Enter a task...">
  <div>
    <button id="start-btn">Start</button>
    <button id="stop-btn">Stop</button>
  </div>
  <div id="status">Ready</div>
  <div id="plan"></div>

  <div class="mode-indicator agent" id="modeIndicator">Mode: Normal Agent (port 3000)</div>


  <div id="reasoningPanel" class="reasoning-panel" style="display: none;">
  <div class="reasoning-header">
    <span class="reasoning-title">AI Reasoning</span>
    <button class="reasoning-clear" id="reasoningClear" title="Clear">Clear</button>
  </div>
  <div class="reasoning-body" id="reasoningBody">
    <div class="reasoning-empty">Waiting for task...</div>
  </div>
</div>


  <script src="sidebar.js"></script>
</body>
</html>
